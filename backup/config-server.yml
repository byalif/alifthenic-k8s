apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server-app
spec:
  selector:
    matchLabels:
      app: config-server-app
  template:
    metadata:
      labels:
        app: config-server-app
    spec:
      containers:
      - name: config-server-app
        image: beatsbyalif/cloud-config:2
        ports:
        - containerPort: 8041
        env:
          - name: EUREKA
            valueFrom:
              configMapKeyRef:
                key: eureka_service_address
                name: eureka-cms
---

apiVersion: v1
kind: Service
metadata:
  name: config-server-svc
spec:
  selector:
    app: config-server-app
  ports:
  - port: 80
    targetPort: 8041
