apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eureka
spec:
  selector:
    matchLabels:
      app: eureka
  serviceName: eureka
  replicas: 1
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
      - name: eureka
        imagePullPolicy: Always
        image: beatsbyalif/eureka-server:8
        ports:
        - containerPort: 8761
---

apiVersion: v1
kind: Service
metadata:
  name: eureka
  labels: 
    app: eureka
spec:
  selector:
    app: eureka
  ports:
  - protocol: TCP
    port: 8761
    targetPort: 8761

