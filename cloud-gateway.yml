apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-gateway-app
spec:
  selector:
    matchLabels:
      app: cloud-gateway-app
  template:
    metadata:
      labels:
        app: cloud-gateway-app
    spec:
      containers:
      - name: cloud-gateway-app
        image: beatsbyalif/api-gateway:1.X.0-5
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
        env:
          - name: CONFIG_SERVER_URL
            valueFrom:
              configMapKeyRef:
                name: config-cm
                key: config_url
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-gateway-svc
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-2:246211615161:certificate/df3d6eb2-aaa9-40c4-bbcf-6071d51fe2b8"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  selector:
    app: cloud-gateway-app
  ports:
  - name: http
    port: 80
    targetPort: 8084
  - name: https
    port: 443
    targetPort: 8084
